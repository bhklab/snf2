name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to publish
        required: true
        type: string
      target:
        description: Package index to publish to
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Create or update release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      release-sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          release-type: python

  build:
    name: Build and verify distributions
    needs: release-please
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      needs.release-please.outputs.release-created == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout immutable release
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.tag ||
            needs.release-please.outputs.tag }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Resolve and verify release
        id: release
        env:
          AUTOMATED_SHA: ${{ needs.release-please.outputs.release-sha }}
          AUTOMATED_TAG: ${{ needs.release-please.outputs.tag }}
          AUTOMATED_VERSION: ${{ needs.release-please.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$MANUAL_TAG"
            version="${tag#v}"
          else
            tag="$AUTOMATED_TAG"
            version="$AUTOMATED_VERSION"
            test "$(git rev-parse HEAD)" = "$AUTOMATED_SHA"
          fi

          test -n "$tag"
          test -n "$version"
          test "$(git rev-parse "$tag^{commit}")" = "$(git rev-parse HEAD)"

          project_version=$(python -c \
            'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          test "$project_version" = "$version"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          environments: dev
          cache: true

      - name: Run locked checks and build
        run: pixi run --locked -e dev check

      - name: Verify distribution filenames
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          test -f "dist/snf2-${VERSION}-py3-none-any.whl"
          test -f "dist/snf2-${VERSION}.tar.gz"
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" = "2"

      - name: Validate distribution metadata
        run: uvx --from "twine==7.0.0" twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7.0.1
        with:
          name: python-distributions-${{ steps.release.outputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish-testpypi:
    name: Publish to TestPyPI
    needs:
      - release-please
      - build
    if: >-
      always() && needs.build.result == 'success' &&
      (github.event_name == 'push' || inputs.target == 'testpypi')
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/snf2
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: python-distributions-${{ needs.build.outputs.tag }}
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  smoke-testpypi:
    name: Test installation from TestPyPI
    needs:
      - build
      - publish-testpypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Install dependencies from PyPI
        run: |
          uv venv --python 3.12
          uv pip install --python .venv/bin/python "numpy>=2,<3" "scipy>=1.18,<2"

      - name: Install release from TestPyPI
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if uv pip install --python .venv/bin/python --no-deps \
              --index-url https://test.pypi.org/simple/ "snf2==${VERSION}"; then
              exit 0
            fi
            if [[ "$attempt" == "6" ]]; then
              exit 1
            fi
            sleep 10
          done

      - name: Run installed-package smoke test
        run: |
          .venv/bin/python - <<'PY'
          import numpy as np
          from scipy.spatial.distance import pdist, squareform
          from snf2 import affinity_matrix, fuse, make_affinity

          first = np.array([[0.0], [0.2], [0.8], [1.0]])
          second = np.array([[1.0], [0.7], [0.3], [0.0]])
          precomputed = squareform(pdist(first, metric="euclidean"))
          networks = [
              affinity_matrix(precomputed, n_neighbors=2),
              make_affinity(second, n_neighbors=2),
          ]
          fused = fuse(networks, n_neighbors=2)
          assert fused.shape == (4, 4)
          assert np.all(np.isfinite(fused))
          PY

  publish-pypi:
    name: Publish to PyPI
    needs:
      - release-please
      - build
      - publish-testpypi
      - smoke-testpypi
    if: >-
      always() && needs.build.result == 'success' &&
      ((github.event_name == 'push' && needs.smoke-testpypi.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'))
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/snf2
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: python-distributions-${{ needs.build.outputs.tag }}
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@v1.14.2
