name: Check

on:
  push:
    branches:
      - dev
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Locked Pixi checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          environments: dev
          cache: true

      - name: Run checks
        run: pixi run --locked -e dev check

  test-python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Create test environment
        run: uv venv --python "${{ matrix.python-version }}"

      - name: Install package and tests
        run: uv pip install --python .venv/bin/python . "pytest>=9,<10"

      - name: Run tests
        run: .venv/bin/python -m pytest
